name: Calidad

on:
  push:
    branches: [main]
  pull_request:

jobs:

  # Una licencia ambigua es motivo de descarte cuando un gobierno evalúa adoptar
  # la herramienta. Esto lo verifica en cada cambio, no una vez al año.
  licencias:
    name: Licencias (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar reuse
        run: pipx install reuse
      - name: Verificar cumplimiento REUSE
        run: reuse lint

  certificado-origen:
    name: Certificado de origen (DCO)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar firma de los commits
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          cabeza="${{ github.event.pull_request.head.sha }}"
          faltantes=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "Falta Signed-off-by en $sha — $(git log -1 --format=%s "$sha")"
              faltantes=$((faltantes + 1))
            fi
          done < <(git rev-list "$base".."$cabeza")
          if [ "$faltantes" -gt 0 ]; then
            echo ""
            echo "Firmá los commits con: git commit -s (o git commit --amend -s --no-edit)"
            echo "Ver CONTRIBUTING.md"
            exit 1
          fi
          echo "Todos los commits están firmados."

  # Tero emite actas con validez administrativa. Un plazo mal calculado o un
  # incumplimiento que se pierde no se ven en pantalla: se ven en el documento
  # que recibe una persona. Por eso las reglas que arman el acta se prueban en
  # cada cambio, no cuando alguien se acuerda.
  pruebas:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-campo/package-lock.json

      # `npm ci` y no `npm install`: instala exactamente lo que fija el
      # package-lock, así una prueba que pasa acá pasa igual en la máquina de
      # quien contribuye.
      - name: Instalar dependencias
        working-directory: app-campo
        run: npm ci

      - name: Correr las pruebas
        working-directory: app-campo
        run: npm run probar

  configuracion:
    name: Configuración de contenedores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: docker compose config --quiet
