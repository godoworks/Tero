name: Publicar sitio

# Construye la aplicación de campo y publica el sitio del proyecto: la
# presentación en la raíz y la aplicación en /app/.
#
# El resultado de la compilación no se versiona: se construye acá en cada
# cambio. Un repositorio abierto no debería llevar archivos generados.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue por vez; si llega otro, se descarta el que está esperando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  construir:
    name: Construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-campo/package-lock.json

      - name: Instalar dependencias
        working-directory: app-campo
        run: npm ci

      - name: Verificar tipos
        working-directory: app-campo
        run: npm run verificar

      - name: Construir la aplicación de campo
        working-directory: app-campo
        run: npm run build

      - name: Preparar el sitio
        run: |
          mkdir -p sitio
          # La presentación va a la raíz; la aplicación queda en /app/,
          # que es donde la construyó Vite.
          cp -r docs/. sitio/
          touch sitio/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
